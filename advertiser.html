<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>캠페인 오픈 준비</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="app.css?v=20261120145403">
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main" id="main"></main>
</div>
<script src="demo.js?v=20261120145403"></script>
<script src="common.js?v=20261120145403"></script>
<script>
/* 광고주 화면. 값은 서버에 저장되고, 금액과 진행 상태는 서버가 rules.yaml로 계산해 보내 준다 */
var ID = new URLSearchParams(location.search).get('c'), BASE = '/api/cases/' + ID;
var S = {seenSent: {}, c: null, d: {}, e: {}, edit: {}, ai: null, aiKeys: {}, runId: null, busy: false, calc: null, budgetTouched: false, imgProblems: null};
/* 주소에 페이지가 없을 때: 협의를 확정하기 전인 새 광고주에게는 안내서를, 그 뒤에는 진행 현황을 먼저 보여준다 */
function page() { return location.hash ? location.hash.slice(1) : (S.c && !S.c.confirmed ? 'guide' : 'home'); }
function today() { var d = new Date(), z = function (n) { return ('0' + n).slice(-2); }; return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()); }
function copy(o) { return JSON.parse(JSON.stringify(o || {})); }

function draft(p) {
  var c = S.c;
  if (p === 'terms') { S.d.terms = copy(c.terms); S.calc = {amount: c.amount, fee_rate: c.fee_rate}; S.budgetTouched = !!c.terms.budget && c.terms.budget !== c.min_amounts[c.terms.product]; }
  if (p === 'contract') { S.d.applicant = copy(c.contract && c.contract.applicant); S.d.extra = c.contract ? {tax_email: c.contract.tax_email, report_email: c.contract.report_email} : {}; S.ai = null; S.aiKeys = {}; }
  if (p === 'test') S.d.test = copy(c.test);
  if (p === 'ideas') S.d.ideas = {intro: (c.idea_points || c.ideas || {}).intro || '', points: ((c.ideas || {}).points || []).filter(function (x) { return c.idea_points && c.idea_points.points.some(function (q) { return q.point === x; }); }), url: c.app_info_url};
  if (p === 'review') S.d.review = c.review ? {cname: c.review.cname, cdesc: c.review.cdesc} : {cname: S.d.creative.cname || '', cdesc: S.d.creative.cdesc || ''};
  if (p === 'creative') { S.d.creative = copy(c.creative); if (!S.d.creative.ccaution) S.d.creative.ccaution = c.default_cautions; S.imgProblems = null; S.review = null; S.reviewStale = false; }
  S.e[p] = {};
}
function load() {
  return api(BASE).then(function (c) {
    if (!c.terms) { $('main').innerHTML = '<div class="page"><div class="note bad"><p>서버에 연결하지 못했어요. 서버가 켜져 있는지 확인해 주세요.</p></div></div>'; return; }
    S.c = c; ['terms', 'contract', 'test', 'creative', 'ideas', 'review'].forEach(draft); render(); });
}
function adopt(r, p) {   /* 서버 응답을 반영. 성공하면 그 페이지의 입력을 저장된 값으로 되돌린다 */
  S.busy = false;
  if (r.ok) { S.c = r.case; S.edit[p] = false; draft(p);
    /* 상품을 정하기 전에 화면을 열었으면 유의사항이 비어 있다. 협의 내용을 저장해 상품이 정해지면 그 상품의 기본 문구를 채운다 */
    if (p === 'terms' && !S.c.creative && !S.d.creative.ccaution) S.d.creative.ccaution = S.c.default_cautions; if (p === 'contract' && contractDoc()) S.flash = 'sec-doc'; else S.navFlash = p; } else S.e[p] = r.errors || {};
  var jumped = !!S.flash;     /* 강조할 곳이 있으면 render가 그 자리로 데려간다 */
  render();
  /* 통과하지 못했으면 맨 위가 아니라 처음 틀린 칸으로 데려간다 */
  var bad = !r.ok && document.querySelector('.f.bad');
  if (bad) { bad.classList.add('shake'); bad.scrollIntoView({block: 'center'}); var box = bad.querySelector('input,select,textarea'); if (box) box.focus({preventScroll: true}); }
  else if (!jumped) window.scrollTo(0, 0);
}
function step(k) { return S.c.checklist.filter(function (x) { return x.key === k; })[0]; }
function contractDoc() { return S.c.docs.filter(function (d) { return d.kind === 'contract'; }).pop(); }

/* ---------- 왼쪽 메뉴 ---------- */
function side() {
  var c = S.c, t = c.terms, p = page();
  var tag = function (done, label) { return done ? '<span class="tag done">' + (label || '제출') + '</span>' : '<span class="tag todo">할 일</span>'; };
  var items = [['guide', c.guide.tab_name, ''], null, ['home', '진행 현황', (function () { var n = c.confirmed && !step('open').done ? c.checklist.filter(function (x) { return x.who === 'advertiser' && !x.done && x.ready && (x.key !== 'sealadv' || contractDoc()) && (x.key !== 'later' || c.later.length); }).length : 0; return n ? '<span class="tag adv">할 일 ' + n + '</span>' : ''; })(), 'navmain'], null,
    ['terms', '협의 내용', tag(c.confirmed, '확정')],
    ['contract', '계약 정보', (c.adv_unseen || []).indexOf('sealops') >= 0 ? '<span class="tag new">최종본 도착</span>' : tag(c.contract && c.seal_adv)],
    ['test', '연동·테스트', tag(c.test)],
    ['creative', '광고 소재', c.creative_reject ? '<span class="tag bad">반려</span>' : tag(c.creative, c.creative && step('adminset').done ? '세팅 완료' : '')], null,
    ['ideas', '소재 기획 도우미', '<span class="tag ai">AI</span>']];
  $('side').innerHTML = '<div class="brand">캠페인 오픈 준비</div><div class="who">' + esc([t.company, t.app, t.product].filter(Boolean).join(' · ') || '새 캠페인') + '</div>' +
    items.map(function (x) {
      if (!x) return '<div class="sep"></div>';
      var news = unreadReplies(x[0]), mark = news.length ? (news.some(function (r) { return verdict(r) === 'rejected'; }) ? VERDICT_TAG.rejected : VERDICT_TAG.approved) : '';
      return '<a class="nav' + (p === x[0] ? ' on' : '') + (x[3] ? ' ' + x[3] : '') + (S.navFlash === x[0] ? ' flash' : '') + '" href="#' + x[0] + '"><span>' + '' + x[1] + '</span><span class="tags">' + mark + x[2] + '</span></a>'; }).join('') +
    '<div class="demo">시연용 화면이에요. 회사와 값은 모두 가상이에요.</div>';
  S.navFlash = null;   /* 제출 직후 한 번만 강조한다 */
}

/* ---------- 진행 현황 ---------- */
var NAME = {terms: '협의 내용 확정', contract: '계약 정보 제출', sealadv: '신청서 날인본 올리기', sealops: '운영사 검토 및 날인', invoice: '세금계산서 발행', paid: '광고비 입금', testinfo: '테스트 정보 제출', test: '연동 테스트', setup: '광고 소재 제출', creative: '소재 검수', adminset: '캠페인 세팅', report: '리포트 계정 생성', later: '나중에 올리기로 한 항목', open: '캠페인 오픈'};
var GO = {terms: 'terms', contract: 'contract', sealadv: 'contract', testinfo: 'test', setup: 'creative'};
function item(text, o) {
  /* 체크 칸은 내가 할 수 있는 일과 끝난 일에만 붙인다. 운영사의 일은 '처리 중' 또는 '대기'로 표시한다 */
  return '<div class="it' + (o.pend ? ' pend' : '') + '">' + (o.tag ? '<span class="tag' + (o.pend ? '' : ' ops') + '">' + o.tag + '</span>'
    : '<span class="cb' + (o.done ? ' on ' + (o.who || '') : '') + '">' + (o.done ? '✓' : '') + '</span>') + '<span>' +
    (o.href ? '<a href="#' + o.href + '">' + text + '</a>' : text) + (o.sub ? '<small>' + o.sub + '</small>' : '') + '</span></div>';
}
function setupCard() {
  /* 운영사가 정한 값만 알려준다. 광고주가 낸 값은 각 페이지에서 볼 수 있다 */
  var c = S.c, s = c.setup, a = c.amount;
  if (!s || !step('adminset').done) return '';
  return '<div class="card"><h2>세팅 내역</h2><p class="h">운영사가 캠페인을 세팅했어요. 아래 내용으로 운영돼요.</p>' + kv([
    ['집행 예산', fmt(a.supply) + '원 · 단가 ' + a.unit_price + '원 (참여 건수 약 ' + fmt(a.count) + '건)'],
    ['운영 기간', esc(s.start_date) + ' ~ ' + (esc(s.end_date) || '소진 시까지')],
    ['데일리캡', s.daily_cap ? '하루 ' + fmt(s.daily_cap) + '건' : '설정 안 함'],
    s.memo && ['운영 메모', esc(s.memo).replace(/\n/g, '<br>')]]) + '</div>';
}
function reportCard() {
  /* 운영사가 리포트 계정을 만들었다고 체크한 뒤에만 안내한다 */
  var c = S.c;
  if (!step('report') || !step('report').done || !c.contract) return '';
  return '<div class="card"><h2>리포트 계정이 준비됐어요</h2><p class="h">캠페인이 라이브되면 아래 주소에서 성과를 확인할 수 있어요.</p>' + kv([
    ['리포트 어드민', '<a href="' + esc(c.report_admin_url) + '" target="_blank" rel="noopener">' + esc(c.report_admin_url) + '</a>'],
    ['로그인 계정', esc(c.contract.report_email) + '<br><span class="h">이 구글 계정으로 로그인해 주세요</span>']]) + '</div>';
}
function openCard() {
  var c = S.c, shots = c.files.filter(function (f) { return f.kind === 'placement'; });
  if (!step('open').done) return '';
  return '<div class="card"><h2>캠페인이 오픈됐어요</h2>' + (shots.length ? '<p class="h">실제로 게재된 화면이에요.</p><div class="shots">' + shots.map(function (f) {
    return '<a href="' + BASE + '/files/' + f.id + '" target="_blank" rel="noopener"><img alt="게재지면 ' + esc(f.name) + '" src="' + BASE + '/files/' + f.id + '"></a>'; }).join('') + '</div>'
    : '<p class="h">게재된 화면은 운영사가 확인한 뒤 여기에 올려 드려요.</p>') + '</div>';
}
/* 누가 언제 무엇을 바꿨는지. 운영자 화면과 같은 기록을 광고주도 본다. words를 주면 그 말로 시작하는 기록만 */
function logCard(words) {
  var list = S.c.log.filter(function (l) { return !words || words.some(function (w) { return l.text.indexOf(w) === 0; }); });
  return list.length ? '<div class="card"><h2>변경 이력</h2><ul class="log">' + list.slice().reverse().map(function (l) { return '<li>' + esc(l.at) + ' · ' + esc(l.by) + ' · ' + esc(l.text) + '</li>'; }).join('') + '</ul></div>' : '';
}
function homePage() {
  var c = S.c, a = c.amount, cpi = c.terms.product === 'CPI', hasDoc = !!contractDoc();
  var cols = {mine: [], ops: [], ok: []}, now = 0;
  c.checklist.forEach(function (x) {
    var k = x.key; if (k === 'approval') return;                      /* 내부 품의는 광고주에게 보여주지 않는다 */
    if (k === 'later' && !c.later.length) return;                     /* 미룬 항목이 없으면 표시하지 않는다 */
    var mine = x.who === 'advertiser' || k === 'paid', sub = '', href = GO[k];
    if (x.done) {
      sub = k === 'sealops' ? '<a href="#contract">최종 날인본 받기</a>' : k === 'invoice' ? esc(c.contract.tax_email) + ' 로 발행했어요'
        : k === 'paid' ? '입금이 확인됐어요' : k === 'test' ? '통과했어요' : k === 'creative' ? (c.creative_review && c.creative_review.passed ? 'AI 검수를 통과했어요' : '승인됐어요') : k === 'adminset' ? '제출하신 내용대로 세팅했어요' : k === 'report' ? '리포트 계정을 만들었어요' : k === 'open' ? '캠페인이 오픈됐어요' : '';
      return cols.ok.push(item(NAME[k], {done: true, who: mine ? 'adv' : 'ops', sub: sub}));   /* 체크 색 = 누가 한 일인지 */
    }
    var can = x.ready && (k !== 'sealadv' || hasDoc);
    if (mine) {
      if (k === 'later') href = c.creative && c.creative.later_image ? 'creative' : 'test';
      sub = k === 'terms' ? '맨 먼저 확정해 주세요' : k === 'contract' ? '사업자등록증을 올리면 자동으로 채워져요'
        : k === 'sealadv' ? (can ? '신청서를 받아 날인한 뒤 올려 주세요' : '협의 내용 확정과 계약 정보 제출이 끝나면 신청서가 만들어져요')
        : k === 'testinfo' ? (cpi ? '앱 식별자와 랜딩 URL' : '연동 방식과 링크') : k === 'setup' ? (c.creative_reject ? '운영사가 반려했어요. 고쳐서 다시 제출해 주세요' : '오픈 3영업일 전까지')
        : k === 'later' ? esc(c.later.join(', ')) + '을(를) 올려 주세요'
        : k === 'paid' ? '세금계산서 발행 후 3일 이내에 입금해 주세요.<br>입금이 들어오면 운영사가 확인하고 이 항목을 완료로 바꿔요. 직접 체크하는 칸은 아니에요.' : '';
      if (can) now++;
      cols.mine[can ? 'unshift' : 'push'](item(NAME[k], k === 'paid' ? {href: null, pend: !can, sub: sub} : {href: can ? href : null, pend: !can, sub: sub}));
    } else {
      sub = can ? (k === 'sealops' ? '날인본을 검토하고 있어요' : k === 'test' ? '진행하고 있어요' : k === 'creative' ? (c.creative_review && c.creative_review.issues && c.creative_review.issues.length ? '운영사에서 반려하는 내용이 있어요' : '검수하고 있어요') : k === 'adminset' ? '세팅하고 있어요' : k === 'report' ? '리포트 계정을 만들고 있어요' : '')
                : (k === 'open' ? '입금 확인을 포함한 모든 단계가 끝나야 해요' : '');
      cols.ops.push(item(NAME[k], {tag: can ? '처리 중' : '대기', pend: !can, sub: sub}));
    }
  });
  var col = function (cls, title, list) { return '<div class="col ' + cls + '"><h2>' + title + ' ' + list.length + '건</h2>' + (list.join('') || '<p class="h">없어요</p>') + '</div>'; };
  var opened = step('open').done;
  return '<div class="page wide"><h1>' + esc(c.terms.app || '새') + ' 캠페인</h1>' +
    '<div class="sum"><span>' + (opened ? '<b>오픈 완료</b>' : '지금 할 수 있는 일<b>' + now + '건</b>') + '</span>' +
    (a.status === 'ok' ? '<span>예산<b>' + fmt(a.supply) + '원</b></span><span>총 입금액<b>' + fmt(a.deposit) + '원</b></span>' : '') + '</div>' +
    unreadReplies().filter(function (r) { return verdict(r) === 'rejected'; }).map(function (r) {
      return '<div class="note warn"><p>' + VERDICT_TAG.rejected + ' <b>' + REQ_LABEL[r.target] + ' 수정 요청이 반려됐어요.</b> <a href="#' + REQ_PAGE[r.target] + '">사유 확인하기</a></p></div>'; }).join('') +
    (c.creative_reject ? '<div class="note warn"><p><span class="tag bad">반려</span> <b>운영사가 광고 소재를 반려했어요.</b> <a href="#creative">사유 확인하고 고치기</a></p></div>' : '') +
    openCard() + setupCard() + reportCard() +
    '<div class="card"><p class="h">순서와 상관없이 할 수 있는 것부터 입력해 주세요. 운영사가 처리한 결과는 이 화면에서 확인할 수 있어요.</p><p class="legend"><span><i class="adv"></i>내가(광고주) 하는 일</span><span><i class="ops"></i>운영사가 하는 일</span></p><div class="board">' +
    col('adv', '내가 할 일', cols.mine) + col('ops', '운영사 처리 대기', cols.ops) + col('ok', '완료', cols.ok) + '</div></div>' +
    (step('paid').done ? '' : '<div class="note warn"><p>입금이 확인되어야 캠페인을 오픈할 수 있어요.</p></div>') + requestsCard() + logCard() + '</div>';
}

/* ---------- 협의 내용 ---------- */
function calcTable() { return '<table>' + amountRows(S.calc && S.calc.amount, S.calc && S.calc.fee_rate) + '</table>' + feeInvoice(S.calc && S.calc.amount); }
/* 대행 수수료가 있으면 대행사가 수수료분 세금계산서를 운영사 앞으로 발행한다. 그때 필요한 서류를 함께 준다 */
function feeInvoice(a) {
  var v = S.c.fee_invoice;
  if (!a || a.status !== 'ok' || !a.fee || step('paid').done) return '';     /* 입금 확인이 풀리면 다시 보인다 */
  return '<div class="note info" style="margin-top:14px"><p><b>' + esc(v.text) + '</b></p>' +
    '<p>대행 수수료 ' + fmt(a.fee) + '원에 대한 세금계산서를 ' + esc(v.to) + ' 앞으로 발행해 주세요. 받는 메일은 ' + esc(v.tax_email) + '이에요. 입금은 수수료를 뺀 총 입금액으로 하시면 돼요.</p>' +
    '<div class="actions" style="margin-top:8px">' + v.files.map(function (f) { return '<a class="btn sm" href="/api/operator-files/' + f[0] + '">' + esc(f[1]) + ' 받기</a>'; }).join('') + '</div></div>';
}
function termsPage() {
  var c = S.c, t = c.terms, ag = t.actor === 'agency';
  var locked = c.locks.terms, editing = c.confirmed && S.edit.terms && !locked;
  /* 확정 전과, 확정 후 고치는 중에는 같은 입력칸을 쓴다. 날인본을 올리기 전까지 광고주가 고칠 수 있다 */
  if (!c.confirmed || editing) return '<div class="page"><h1>협의 내용</h1><p class="lead">' + (editing ? '확정한 내용을 고치는 중이에요. 저장하면 신청서가 새로 만들어지고, 무엇을 바꿨는지 운영사에 표시돼요.' : '협의한 내용이 맞는지 확인하고 확정해 주세요. 확정한 뒤에도 날인본을 올리기 전까지는 고칠 수 있어요.') + '</p>' +
    '<div class="card"><div class="grid2">' + termsFields(S.d.terms, S.e.terms, S.c.guide.compare) + '</div></div>' +
    '<div class="card"><h2>금액</h2><div id="tcalc">' + calcTable() + '</div></div>' + errNote(S.e.terms) +
    '<div class="actions">' + (editing ? '<button class="pri" data-act="save-terms"' + (S.busy ? ' disabled' : '') + '>수정 저장</button><button data-act="cancel" data-p="terms">취소</button>'
      : '<button class="pri" data-act="confirm"' + (S.busy ? ' disabled' : '') + '>협의 내용 확정하기</button>') + '</div></div>';

    S.flash = act === 'use-both' ? ['creative_cname', 'creative_cdesc'] : act === 'use-name' || act === 'use-rname' ? ['creative_cname'] : ['creative_cdesc'];
    location.hash = '#creative';      /* 화면 전환과 맨 위로 올리기는 hashchange가 한다 */
  }
  if (act === 'req-open') { S.req = {target: b.dataset.t, text: ''}; S.e.req = {}; render(); }
  if (act === 'req-cancel') { S.req = null; render(); }
  if (act === 'req-send') { S.busy = true; render(); api(BASE + '/requests', S.req).then(function (r) { S.busy = false; if (r.ok) { S.c = r.case; S.req = null; S.e.req = {}; } else S.e.req = r.errors || {}; render(); }); }
  if (act === 'seal-force') sendSeal(true);
  if (act === 'review-creative') {
    S.busy = 'review'; S.flash = 'sec-wait'; render();
    api(BASE + '/creative-review', S.d.creative).then(function (r) {
      S.busy = false;
      if (r.ok) { S.review = r.review; S.reviewStale = false; S.e.creative = {}; S.flash = 'sec-review'; render(); }
      else { S.e.creative = r.errors || {}; render(); var bad = document.querySelector('.f.bad'); if (bad) { bad.classList.add('shake'); bad.scrollIntoView({block: 'center'}); } }
    });
  }
  if (act === 'submit-creative') { S.busy = 'creative'; render(); api(BASE + '/creative', S.d.creative).then(function (r) { adopt(r, 'creative'); }); }
});
window.addEventListener('hashchange', function () { if (page() !== 'creative') S.used = ''; render(); window.scrollTo(0, 0); });
/* 알림이 없는 대신, 운영사가 처리한 것이 있으면 새로고침을 권한다. 입력 중인 내용을 지우지 않으려고 자동으로 다시 그리지는 않는다 */
setInterval(function () {
  if (!S.c || document.hidden || S.busy || $('fresh-bar')) return;
  api(BASE).then(function (c) {
    if (c && c.updated_at && c.updated_at !== S.c.updated_at)
      document.body.insertAdjacentHTML('afterbegin', '<div class="freshbar" id="fresh-bar"><span>운영사가 처리한 내용이 있어요.</span><button type="button" data-act="fresh">새로고침</button></div>');
  });
}, 15000);
load();
</script>
